name: Supabase Heartbeat

on:
  schedule:
    # 07:17, 11:17 e 15:17 no horario de Brasilia (UTC-3).
    - cron: "17 10,14,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-l4-supabase-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Keep Studio L4 Supabase active
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      HEARTBEAT_URL: https://juyokuqvjpcieumvylsp.supabase.co/functions/v1/heartbeat

    steps:
      - name: Call heartbeat function
        shell: bash
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/studio-l4-heartbeat.json \
            --write-out "%{http_code}" \
            --request GET \
            --header "Accept: application/json" \
            "${HEARTBEAT_URL}")

          echo "Supabase HTTP status: ${HTTP_CODE}"
          cat /tmp/studio-l4-heartbeat.json
          echo

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Supabase heartbeat failed with HTTP ${HTTP_CODE}."
            exit 1
          fi

          echo "Studio L4 heartbeat completed successfully at $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
